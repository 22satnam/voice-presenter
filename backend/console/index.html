<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podium · Backend console</title>
<style>
:root{font:14px system-ui,sans-serif;color:#e2e8f0;background:#090e1b}*{box-sizing:border-box}body{margin:0}header{padding:18px 5%;display:flex;flex-wrap:wrap;gap:18px;align-items:center;border-bottom:1px solid #273449}a{color:#9bb3ff;text-decoration:none}nav{display:flex;gap:18px;flex-wrap:wrap}main{max-width:1280px;margin:auto;padding:28px 20px}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px}p{color:#9aa8c0}button,input,select{font:inherit;color:inherit;background:#151e30;border:1px solid #39435a;border-radius:9px;padding:9px 12px}button{cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}.card,.panel{background:#141d2c;border:1px solid #2c3a52;border-radius:14px;padding:17px}.label{color:#aab5ca}.value{font-size:26px;font-weight:650;margin-top:7px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:20px 0}.terminal{background:#060b15;border:1px solid #243249;border-radius:12px;max-height:500px;overflow:auto;font:12px ui-monospace,monospace}.line{padding:8px 11px;border-bottom:1px solid #1d2737;white-space:normal;word-wrap:break-word}.muted{color:#8494b4}.pii{color:#ff82af}.error{color:#ff9292}.route{color:#b8a9ff}.llm{color:#8baaff}.tts{color:#6fd9c7}.stt{color:#9fd9f2}.nav{color:#80d9a0}.fallback{color:#eec177}details>summary{cursor:pointer}pre{white-space:pre-wrap;color:#a9c7e4}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:16px}@media(max-width:760px){.cols{grid-template-columns:1fr}}.metricrow{display:flex;justify-content:space-between;margin:7px 0}.errorbar{color:#ff9292;margin:13px 0}
</style></head><body><header><strong style="font-size:19px">▥ Podium</strong><nav><a id="presenter" href="__FRONTEND_ORIGIN__">Presenter ↗</a><a href="https://github.com/22satnam/voice-presenter">GitHub ↗</a><a href="https://satnamsingh.in">Portfolio ↗</a><a href="https://linkedin.com/in/22satnam">LinkedIn ↗</a></nav></header>
<main><h1>Backend console</h1><p>Actual redacted API telemetry. No simulated traffic, invented token counts, or stored personal values.</p>
<div class="toolbar"><label>Admin token <input id="token" type="password" placeholder="CONSOLE_ADMIN_TOKEN"></label><label>Window <select id="range"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="1440">24 hours</option></select></label><label>Kind <select id="kind"><option value="">All events</option><option>llm</option><option>route</option><option>stt</option><option>tts</option><option>pii_blocked</option><option>interrupt</option><option>nav</option><option>fallback</option><option>error</option></select></label><input id="session" placeholder="Filter session ID"><button id="refresh">Refresh</button><button id="pause">Pause</button></div>
<div id="alert" role="alert" class="errorbar"></div><section id="cards" class="cards"></section><div class="cols"><section class="panel"><h2>Stage latency (ms)</h2><div id="latency"></div></section><section class="panel"><h2>Model usage</h2><div id="usage"></div></section></div><h2>Redacted live feed</h2><div id="terminal" class="terminal"><div class="line muted">Connecting to event store…</div></div>
</main><script>
const $=(id)=>document.getElementById(id),escapeHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const presenter=new URLSearchParams(location.search).get('presenter');if(presenter&&/^https?:\/\//.test(presenter))$('presenter').href=presenter;
let paused=false,events=[];
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause'};
$('refresh').onclick=()=>void poll();for(const i of ['kind','range','session'])$(i).oninput=()=>render();
function metric(label,value){return `<article class="card"><div class="label">${label}</div><div class="value">${value}</div></article>`}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):'—'}
function p95(a){if(!a.length)return '—';const s=[...a].sort((x,y)=>x-y);return Math.round(s[Math.ceil(.95*s.length)-1])}
function render(){const until=Date.now()-Number($('range').value)*60000;const kind=$('kind').value,session=$('session').value.toLowerCase();const shown=events.filter(e=>new Date(e.ts).getTime()>=until&&(!kind||e.kind===kind)&&(!session||(e.session_id||'').toLowerCase().includes(session)));
const kinds=k=>shown.filter(e=>e.kind===k);const answers=kinds('llm').filter(e=>e.route==='/api/answer');const sessions=new Set(shown.map(e=>e.session_id)).size;
$('cards').innerHTML=metric('Sessions',sessions)+metric('Answers',answers.length)+metric('Slide routes',kinds('route').length)+metric('Interruptions',kinds('interrupt').length)+metric('PII blocks',kinds('pii_blocked').length)+metric('Errors',kinds('error').length);
const stage=[['STT',kinds('stt')],['Router',kinds('route')],['First answer token',answers],['First audio',kinds('tts')]];
$('latency').innerHTML=stage.map(([name,list])=>{const l=list.map(e=>e.latency_ms).filter(x=>Number.isFinite(x));return `<div class="metricrow"><span>${name}</span><span>avg ${avg(l)} · p95 ${p95(l)}</span></div>`}).join('');
const inTokens=shown.reduce((n,e)=>n+(e.input_tokens||0),0),outTokens=shown.reduce((n,e)=>n+(e.output_tokens||0),0);
const quota=shown.find(e=>e.kind==='route'&&e.payload?.rate_limit_requests);
const quotaRows=quota ? [['Groq requests remaining',quota.payload.rate_remaining_requests,quota.payload.rate_limit_requests],['Groq tokens remaining',quota.payload.rate_remaining_tokens,quota.payload.rate_limit_tokens]].map(([name,remaining,limit])=>`<div class="metricrow"><span>${name}</span><strong>${escapeHtml(remaining)} / ${escapeHtml(limit)}</strong></div>`).join('') : '<div class="muted">Quota headers appear after a Groq router request.</div>';
const providers={};shown.forEach(e=>{if(e.provider){const k=e.provider+'/'+(e.model||'');providers[k]=(providers[k]||0)+(e.input_tokens||0)+(e.output_tokens||0)}});
$('usage').innerHTML=`<div class="metricrow"><span>Input tokens</span><strong>${inTokens.toLocaleString()}</strong></div><div class="metricrow"><span>Output tokens</span><strong>${outTokens.toLocaleString()}</strong></div>`+quotaRows+Object.entries(providers).map(([k,v])=>`<div class="metricrow"><span>${escapeHtml(k)}</span><span>${v.toLocaleString()} tokens</span></div>`).join('');
$('terminal').innerHTML=shown.length?shown.map(e=>`<details class="line"><summary><span class="muted">${escapeHtml(new Date(e.ts).toLocaleTimeString())}</span> <span class="${escapeHtml(e.kind)}">${escapeHtml(e.kind.toUpperCase())}</span> ${escapeHtml(e.route)} · ${escapeHtml(e.session_id?.slice(0,8))} ${e.latency_ms!=null?'· '+e.latency_ms+'ms':''}</summary><pre>${escapeHtml(JSON.stringify(e,null,2))}</pre></details>`).join(''):'<div class="line muted">No events in this window.</div>';
}
async function poll(){if(paused)return;try{const r=await fetch('/api/events?limit=200',{headers:{'X-Console-Token':$('token').value}});if(!r.ok)throw Error(r.status===401?'Provide the admin token configured in backend.':'Event API unavailable.');events=(await r.json()).events||[];$('alert').textContent='';render()}catch(e){$('alert').textContent=e.message}}
void poll();setInterval(()=>void poll(),4000);
</script></body></html>
